<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hxsfx</title>
    <script src="https://unpkg.com/pinyin-pro"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }

      :root {
        --bg-primary: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        --bg-secondary: white;
        --bg-tertiary: #f8f9fa;
        --text-primary: #2c3e50;
        --text-secondary: #7f8c8d;
        --text-accent: #3498db;
        --border-color: #e0e0e0;
        --shadow-color: rgba(0, 0, 0, 0.1);
        --shadow-light: rgba(0, 0, 0, 0.05);
        --focus-color: rgba(52, 152, 219, 0.2);
        --button-primary: #3498db;
        --button-primary-hover: #2980b9;
        --button-danger: #e74c3c;
        --button-danger-hover: #c0392b;
        --canvas-border: #bdc3c7;
        --canvas-bg: white;
        --pencil-color: #3498db;
      }

      [data-theme='dark'] {
        --bg-primary: linear-gradient(135deg, #232526 0%, #414345 100%);
        --bg-secondary: #2c2c2c;
        --bg-tertiary: #3a3a3a;
        --text-primary: #f5f5f5;
        --text-secondary: #b0b0b0;
        --text-accent: #5dade2;
        --border-color: #444;
        --shadow-color: rgba(0, 0, 0, 0.3);
        --shadow-light: rgba(0, 0, 0, 0.2);
        --focus-color: rgba(93, 173, 226, 0.3);
        --button-primary: #5dade2;
        --button-primary-hover: #3498db;
        --button-danger: #e74c3c;
        --button-danger-hover: #c0392b;
        --canvas-border: #555;
        --canvas-bg: #1e1e1e;
        --pencil-color: #5dade2;
      }

      body {
        background: var(--bg-primary);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
      }

      .container {
        max-width: 900px;
        width: 100%;
        background-color: var(--bg-secondary);
        border-radius: 16px;
        box-shadow: 0 10px 30px var(--shadow-color);
        overflow: hidden;
        padding: 20px;
        transition: all 0.5s ease;
      }

      @media (max-width: 768px) {
        .container {
          padding: 16px;
          border-radius: 12px;
        }
      }

      .input-section {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
      }

      #Chinese {
        flex: 1;
        min-width: 0;
        padding: 14px;
        font-size: 1.1rem;
        border: 2px solid var(--border-color);
        border-radius: 10px;
        outline: none;
        transition: all 0.3s ease;
        background-color: var(--bg-secondary);
        color: var(--text-primary);
      }

      @media (max-width: 768px) {
        #Chinese {
          width: 100%;
        }
      }

      #Chinese:focus {
        border-color: var(--text-accent);
        box-shadow: 0 0 0 3px var(--focus-color);
      }

      #Chinese::placeholder {
        color: var(--text-secondary);
      }

      #MatchStrR {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 0 auto 20px;
        border-radius: 8px;
        box-shadow: 0 2px 6px var(--shadow-light);
      }

      @media (max-width: 768px) {
        #MatchStrR {
          margin-bottom: 16px;
        }
      }

      .content-wrapper {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      @media (max-width: 768px) {
        .content-wrapper {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr 1fr;
        }
      }

      .pinyin-section,
      .handwriting-section {
        background-color: var(--bg-tertiary);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 6px var(--shadow-light);
        transition: all 0.5s ease;
      }
      @media (max-width: 768px) {
        .pinyin-section,
        .handwriting-section {
          padding: 0;
        }
      }
      .section-title {
        font-size: 1.3rem;
        color: var(--text-primary);
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border-color);
        font-weight: 500;
        transition: all 0.5s ease;
      }

      #Pinyin {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
        gap: 15px;
        height: 443px;
        overflow: auto;
      }

      @media (max-width: 768px) {
        #Pinyin {
          height: 421px;
        }
      }

      .pinyin-item {
        background: var(--bg-secondary);
        border-radius: 8px;
        padding: 12px;
        text-align: center;
        box-shadow: 0 2px 4px var(--shadow-light);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        /* min-height: 140px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center; */
      }

      @media (max-width: 480px) {
        .pinyin-item {
          padding: 10px;
        }

        .character {
          font-size: 1.8rem;
        }

        .pinyin-value {
          font-size: 1rem;
        }

        .pinyin-image {
          height: 60px;
        }
      }

      .pinyin-item:hover {
        transform: translateY(-3px);
        box-shadow: 0 4px 8px var(--shadow-color);
      }

      .character {
        font-size: 2rem;
        color: var(--text-primary);
        margin-bottom: 8px;
        font-weight: bold;
      }

      .pinyin-type {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin-top: 8px;
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .pinyin-value {
        font-size: 1.1rem;
        color: var(--text-accent);
        font-weight: 500;
        margin-bottom: 8px;
      }

      .pinyin-image {
        max-width: 100%;
        height: 80px;
        object-fit: contain;
        margin-top: 5px;
        border-radius: 4px;
        background-color: var(--bg-tertiary);
        padding: 5px;
      }

      .handwriting-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }

      .control-btn {
        padding: 10px 14px;
        border: none;
        border-radius: 6px;
        background-color: var(--button-primary);
        color: white;
        cursor: pointer;
        font-size: 0.95rem;
        transition: background-color 0.2s ease, transform 0.2s ease;
        white-space: nowrap;
      }

      .control-btn:hover {
        background-color: var(--button-primary-hover);
        transform: translateY(-2px);
      }

      .control-btn.clear {
        background-color: var(--button-danger);
      }

      .control-btn.clear:hover {
        background-color: var(--button-danger-hover);
      }

      #Handwriting {
        display: block;
        width: 100%;
        height: 399px;
        border: 2px dashed var(--canvas-border);
        border-radius: 10px;
        cursor: crosshair;
        background-color: var(--canvas-bg);
        transition: border-color 0.3s ease;
      }

      @media (max-width: 768px) {
        #Handwriting {
          height: 300px;
        }
      }

      #Handwriting:hover {
        border-color: var(--text-accent);
      }

      .theme-toggle {
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background-color: var(--button-primary);
        color: white;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 500;
        transition: all 0.3s ease;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 6px var(--shadow-color);
        justify-content: center;
      }

      .theme-toggle:hover {
        background-color: var(--button-primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 8px var(--shadow-color);
      }

      .theme-toggle .icon {
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="input-section">
        <button class="theme-toggle" id="ThemeToggle">
          <span class="icon">🌙</span>
        </button>
        <input id="Chinese" type="text" placeholder="请输入中文汉字..." autocomplete="off" />
      </div>
      <img id="MatchStrR" />
      <div class="content-wrapper">
        <div class="pinyin-section">
          <div id="Pinyin"></div>
        </div>

        <div class="handwriting-section">
          <canvas id="Handwriting"></canvas>
          <div class="handwriting-controls">
            <button class="control-btn clear" id="ClearCanvas">清除画布</button>
            <button class="control-btn" id="ChangeColor">更换颜色</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      var { pinyin } = pinyinPro

      function enable_drawing(canvas_elem, options = {}) {
        const ctx = canvas_elem.getContext('2d')
        let color =
          options.color ||
          getComputedStyle(document.documentElement).getPropertyValue('--pencil-color').trim()
        const line_width = options.line_width || 3

        let is_drawing = false
        let last_x = 0
        let last_y = 0

        ctx.strokeStyle = color
        ctx.lineWidth = line_width
        ctx.lineCap = 'round'
        ctx.lineJoin = 'round'

        // 鼠标事件
        canvas_elem.addEventListener('mousedown', (e) => {
          is_drawing = true
          const rect = canvas_elem.getBoundingClientRect()
          last_x = e.clientX - rect.left
          last_y = e.clientY - rect.top
        })

        canvas_elem.addEventListener('mousemove', (e) => {
          if (!is_drawing) return
          const rect = canvas_elem.getBoundingClientRect()
          const current_x = e.clientX - rect.left
          const current_y = e.clientY - rect.top
          ctx.beginPath()
          ctx.moveTo(last_x, last_y)
          ctx.lineTo(current_x, current_y)
          ctx.stroke()
          last_x = current_x
          last_y = current_y
        })

        const stop_drawing = () => {
          is_drawing = false
        }
        canvas_elem.addEventListener('mouseup', stop_drawing)
        canvas_elem.addEventListener('mouseleave', stop_drawing)

        // 触摸事件（移动端支持）
        canvas_elem.addEventListener('touchstart', (e) => {
          e.preventDefault()
          is_drawing = true
          const rect = canvas_elem.getBoundingClientRect()
          const touch = e.touches[0]
          last_x = touch.clientX - rect.left
          last_y = touch.clientY - rect.top
        })

        canvas_elem.addEventListener('touchmove', (e) => {
          if (!is_drawing) return
          e.preventDefault()
          const rect = canvas_elem.getBoundingClientRect()
          const touch = e.touches[0]
          const current_x = touch.clientX - rect.left
          const current_y = touch.clientY - rect.top
          ctx.beginPath()
          ctx.moveTo(last_x, last_y)
          ctx.lineTo(current_x, current_y)
          ctx.stroke()
          last_x = current_x
          last_y = current_y
        })

        canvas_elem.addEventListener('touchend', () => {
          is_drawing = false
        })

        return {
          setColor: (newColor) => {
            color = newColor
            ctx.strokeStyle = color
          },
          clearCanvas: () => {
            ctx.clearRect(0, 0, canvas_elem.width, canvas_elem.height)
          },
          updateThemeColor: () => {
            const newColor = getComputedStyle(document.documentElement)
              .getPropertyValue('--pencil-color')
              .trim()
            color = newColor
            ctx.strokeStyle = color
          }
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        const canvas = document.querySelector('#Handwriting')
        const drawing = enable_drawing(canvas, { line_width: 3 })

        function resizeCanvas() {
          const container = canvas.parentElement
          canvas.width = container.clientWidth
          canvas.height = window.innerWidth < 768 ? 300 : 399
        }

        window.addEventListener('resize', resizeCanvas)
        resizeCanvas()

        document.querySelector('#ClearCanvas').addEventListener('click', () => {
          drawing.clearCanvas()
        })

        document.querySelector('#ChangeColor').addEventListener('click', () => {
          const colors = [
            '#3498db',
            '#e74c3c',
            '#2ecc71',
            '#f39c12',
            '#9b59b6',
            '#1abc9c',
            '#5dade2',
            '#e67e22',
            '#27ae60',
            '#8e44ad',
            '#16a085',
            '#d35400'
          ]
          const randomColor = colors[Math.floor(Math.random() * colors.length)]
          drawing.setColor(randomColor)
        })

        drawing.updateThemeColor()

        document.querySelector('#Chinese').addEventListener('input', (event) => {
          const py_strs = event.target.value
          let html = ''

          for (const py_str of py_strs) {
            const pattern_l = ['initial', 'final', 'pinyin']
            const pinyin_result = []

            for (const pattern of pattern_l) {
              pinyin_result.push(
                pinyin(py_str, {
                  pattern,
                  toneType: 'none',
                  type: 'array',
                  v: true,
                  initialPattern: 'standard'
                })
              )
            }

            html += `
              <div class="pinyin-item">
                <div class="character">${py_str}</div>
                <div class="pinyin-value">${pinyin_result[0]}</div>
                <img class="pinyin-image" src="./img/${pinyin_result[0]}.png" alt="${pinyin_result[0]}" />
                <div class="pinyin-value">${pinyin_result[1]}</div>
                <img class="pinyin-image" src="./img/${pinyin_result[1]}.png" alt="${pinyin_result[1]}" />
                <div class="pinyin-value">${pinyin_result[2]}</div>
                <img class="pinyin-image" src="./img/${pinyin_result[2]}.png" alt="${pinyin_result[2]}" />
              </div>`
          }

          document.querySelector('#Pinyin').innerHTML = html
          document.querySelector('#MatchStrR').src = `./img/${py_strs}.png`
        })

        const themeToggle = document.getElementById('ThemeToggle')
        const currentTheme = localStorage.getItem('theme') || 'light'
        document.documentElement.setAttribute('data-theme', currentTheme)
        updateThemeButton(currentTheme)

        themeToggle.addEventListener('click', () => {
          const currentTheme = document.documentElement.getAttribute('data-theme')
          const newTheme = currentTheme === 'light' ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', newTheme)
          localStorage.setItem('theme', newTheme)
          updateThemeButton(newTheme)
          drawing.updateThemeColor()
        })

        function updateThemeButton(theme) {
          const icon = themeToggle.querySelector('.icon')
          if (theme === 'dark') {
            icon.textContent = '☀️'
          } else {
            icon.textContent = '🌙'
          }
        }
      })
    </script>
  </body>
</html>
